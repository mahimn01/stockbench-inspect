title: "StockBench: Can LLM Agents Trade Stocks Profitably In Real-world Markets?"
description: |
  An LLM agent manages $100,000 across 20 Dow Jones stocks for the 83 trading days from
  March 3 to June 30, 2025. Each day a filter agent picks the stocks that need
  fundamentals, then a decision agent sets a target dollar amount for every stock from
  prices, the last 7 closes, recent news and positions. Orders fill at the open. Scores
  are cumulative return, maximum drawdown and daily Sortino ratio, alongside an
  equal-weight buy-and-hold baseline over the same days.
arxiv: https://arxiv.org/abs/2510.02209
group: Reasoning
contributors: ["mahimn01"]
