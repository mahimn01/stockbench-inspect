[project]
name = "stockbench-inspect"
version = "0.1.0"
description = "StockBench (LLM agents trading 20 Dow stocks) as an Inspect evaluation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "demjson3==3.0.6",
    "filelock>=3.12",
    "inspect_ai>=0.3.283",
    "json-repair==0.51.0",
    "platformdirs>=4.0",
    "pyarrow>=17.0",
]

[project.entry-points.inspect_ai]
stockbench_inspect = "stockbench_inspect"

[dependency-groups]
dev = [
    "openai>=2.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockbench_inspect"]

[tool.inspect-evals-lint]
preset = "single-eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the upstream StockBench data (downloads it once, about 6 MB)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "SIM", "PLW1514"]
# Prompt and retry strings are kept on one line so they match upstream byte for byte.
ignore = ["E501"]
